name: Feature request
description: Suggest a focused improvement to Sitka Shell
labels: ["enhancement"]
type: "Feature"
title: "[Feature] "
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the desired interaction and where it belongs.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives
      description: Note any existing workaround or competing design.

  - type: checkboxes
    attributes:
      label: Scope
      options:
        - label: This fits Sitka Shell's Niri-first, declarative configuration direction.
          required: true
