name: Bug report
description: Report a reproducible Sitka Shell problem
labels: ["bug"]
type: "Bug"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Sitka Shell is Niri-first; clearly
        identify the compositor when reporting compositor-specific behavior.

  - type: input
    attributes:
      label: Sitka Shell revision
      description: Provide a release tag or commit hash.
      placeholder: Output of git rev-parse --short HEAD
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Compositor
      options:
        - Niri
        - Hyprland
        - Other Wayland compositor
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Sitka Shell with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      description: Paste the relevant terminal or Quickshell log excerpt.
      render: shell

  - type: textarea
    attributes:
      label: Additional context
      description: Add screenshots, configuration excerpts, or hardware details.
